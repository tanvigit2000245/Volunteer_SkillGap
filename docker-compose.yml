services:
  mongodb:
    image: mongo:7.0
    container_name: volunteer_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: volunteer_SkillGap
    volumes:
      - mongo_data:/data/db

  optimization_engine:
    build:
      context: ./optimization_engine
      dockerfile: Dockerfile
    container_name: volunteer_optimization_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteer_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongodb:27017/volunteer_SkillGap
      ENGINE_URL: http://optimization_engine:8000
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: dev_secret_jwt_key_volunteer_planner_32chars
      JWT_REFRESH_SECRET: dev_secret_jwt_refresh_key_volunteer_planner_32chars
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongodb
      - optimization_engine

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: volunteer_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
