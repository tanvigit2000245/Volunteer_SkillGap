name: Volunteer Skill-Gap CI Pipeline

on:
  push:
    branches:
      - main
      - luciBackend
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Code Syntax & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Backend JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax across backend..."
          node --check backend/app.js
          node --check backend/test_optimization_integration.js
          find backend/src -name "*.js" -exec node --check {} +
          find backend/tests -name "*.js" -exec node --check {} +
          echo "✅ All backend JavaScript files passed syntax verification."

      - name: Validate Python Syntax
        run: |
          echo "Compiling Python source files..."
          python -m py_compile optimization_engine/main.py
          python -m py_compile optimization_engine/solver.py
          python -m py_compile optimization_engine/schemas.py
          python -m py_compile optimization_engine/test_optimizer.py
          echo "✅ All Python files compiled without syntax errors."

      - name: Verify Environment Example & Git Configuration
        run: |
          if [ ! -f "backend/.env.example" ]; then
            echo "❌ Missing backend/.env.example template!"
            exit 1
          fi
          if [ ! -f ".gitignore" ]; then
            echo "❌ Missing root .gitignore!"
            exit 1
          fi
          echo "✅ Environment templates and gitignore present."

  backend-ci:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm test

  optimization-engine-ci:
    name: Optimization Solver Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: optimization_engine/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r optimization_engine/requirements.txt

      - name: Run MILP Optimization Tests
        run: python -m unittest discover -s optimization_engine -p "test_*.py" -v

  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Frontend Lint
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  e2e-integration-ci:
    name: End-to-End Inter-Service Integration
    needs: [backend-ci, optimization-engine-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: optimization_engine/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r optimization_engine/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Optimization Microservice in Background
        run: |
          echo "Starting Python Optimization FastAPI server on port 8000..."
          python -m uvicorn main:app --app-dir optimization_engine --host 127.0.0.1 --port 8000 &
          OPT_PID=$!
          echo "OPT_PID=$OPT_PID" >> $GITHUB_ENV

          echo "Waiting for http://127.0.0.1:8000/health..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "✅ Optimization service is up and healthy!"
              break
            fi
            echo "Waiting for service... ($i/30)"
            sleep 1
          done

      - name: Run Integration Tests Against Running Solver
        working-directory: backend
        env:
          ENGINE_URL: http://127.0.0.1:8000
        run: npm run test:engine

      - name: Stop Background Microservice
        if: always()
        run: |
          if [ -n "$OPT_PID" ]; then
            kill $OPT_PID || true
          fi

  ci-status:
    name: CI Pipeline Status Check
    needs: [lint-and-syntax, backend-ci, optimization-engine-ci, frontend-ci, e2e-integration-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.lint-and-syntax.result }}" != "success" ] || \
             [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.optimization-engine-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.e2e-integration-ci.result }}" != "success" ]; then
            echo "❌ One or more CI pipeline stages failed. Do not merge until resolved!"
            exit 1
          fi
          echo "🎉 All CI checks passed successfully! Pull request is safe to merge."
